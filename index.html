<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>統測農業概論第9章水產養殖(90-115學年)試屆盃</title>
    <!-- Tailwind CSS v3 穩定版 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- 頂部導覽列 -->
    <header class="bg-emerald-700 text-white shadow-md py-4 px-6">
        <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center">
            <h1 class="text-xl sm:text-2xl font-bold tracking-wide text-center sm:text-left">
                <strong>統測農業概論第9章水產養殖(90-115學年)試屆盃</strong>
            </h1>
            <div id="timer-display" class="hidden mt-2 sm:mt-0 bg-emerald-800 px-3 py-1 rounded-full text-sm font-medium">
                ⏱️ 測驗時間: <span id="time-val">00:00</span>
            </div>
        </div>
    </header>

    <!-- 主內容區 -->
    <main class="max-w-3xl w-full mx-auto p-4 sm:p-6 my-auto">

        <!-- 1. 設定畫面 (Config Screen) -->
        <section id="config-screen" class="bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-100">
            <div class="text-center mb-6">
                <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-3 py-1 rounded-full uppercase">統測備考專用</span>
                <h2 class="text-2xl font-bold text-slate-900 mt-2">線上模擬測驗設定</h2>
                <p class="text-slate-500 text-sm mt-1">請選擇您的測驗題數與出題模式，準備挑戰滿分！</p>
            </div>

            <div class="space-y-6">
                <!-- 題數選擇 -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">選擇測驗題數 (總分固定 100 分)：</label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <button type="button" onclick="setCount(20)" class="count-btn py-2.5 px-4 border rounded-xl font-medium text-sm transition-all border-slate-200 hover:bg-emerald-50 hover:border-emerald-500 focus:outline-none" data-count="20">20 題</button>
                        <button type="button" onclick="setCount(40)" class="count-btn py-2.5 px-4 border rounded-xl font-medium text-sm transition-all border-slate-200 hover:bg-emerald-50 hover:border-emerald-500 focus:outline-none" data-count="40">40 題</button>
                        <button type="button" onclick="setCount(50)" class="count-btn py-2.5 px-4 border rounded-xl font-medium text-sm transition-all border-slate-200 hover:bg-emerald-50 hover:border-emerald-500 focus:outline-none" data-count="50">50 題</button>
                        <button type="button" onclick="setCount('all')" class="count-btn py-2.5 px-4 border rounded-xl font-medium text-sm transition-all bg-emerald-600 text-white border-emerald-600 shadow-sm focus:outline-none" data-count="all">全部試題 (131題)</button>
                    </div>
                </div>

                <!-- 模式選擇 -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2">選擇出題模式：</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" onclick="setMode('random')" class="mode-btn py-2.5 px-4 border rounded-xl font-medium text-sm transition-all bg-emerald-600 text-white border-emerald-600 shadow-sm focus:outline-none" data-mode="random">🔀 隨機選題</button>
                        <button type="button" onclick="setMode('sequential')" class="mode-btn py-2.5 px-4 border rounded-xl font-medium text-sm transition-all border-slate-200 hover:bg-emerald-50 hover:border-emerald-500 focus:outline-none" data-mode="sequential">🔢 依題號順序</button>
                    </div>
                </div>

                <!-- 開始按鈕 -->
                <button onclick="startQuiz()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition-transform active:scale-[0.99] flex items-center justify-center gap-2">
                    <span>🚀 開始測驗</span>
                </button>
            </div>
        </section>

        <!-- 2. 測驗進行畫面 (Quiz Screen) -->
        <section id="quiz-screen" class="hidden bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-100">
            <!-- 進度列與題號 -->
            <div class="flex justify-between items-center mb-4">
                <span id="question-counter" class="text-xs font-semibold bg-slate-100 text-slate-600 px-3 py-1 rounded-full">第 1 題 / 共 20 題</span>
                <span id="score-per-question" class="text-xs font-medium text-emerald-600">每題 5.0 分</span>
            </div>
            <div class="w-full bg-slate-100 h-2 rounded-full mb-6 overflow-hidden">
                <div id="progress-bar" class="bg-emerald-600 h-full transition-all duration-300" style="width: 0%"></div>
            </div>

            <!-- 題目內容 -->
            <div class="mb-6">
                <h3 id="question-text" class="text-lg sm:text-xl font-bold text-slate-900 leading-relaxed">
                    <!-- 題目將動態載入 -->
                </h3>
            </div>

            <!-- 選項列表 -->
            <div id="options-container" class="space-y-3 mb-6">
                <!-- 選項將動態載入 -->
            </div>

            <!-- 即時回饋與解析區 -->
            <div id="feedback-box" class="hidden mb-6 p-4 rounded-xl border">
                <div id="feedback-title" class="font-bold text-sm mb-1"></div>
                <div id="feedback-desc" class="text-sm text-slate-700 leading-relaxed"></div>
            </div>

            <!-- 操作按鈕 -->
            <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                <button id="toggle-exp-btn" onclick="toggleExplanation()" class="hidden text-sm font-medium text-emerald-600 hover:text-emerald-700 flex items-center gap-1">
                    📖 查看詳細解析
                </button>
                <div class="ml-auto">
                    <button id="next-btn" onclick="nextQuestion()" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 px-6 rounded-xl shadow transition-all">
                        下一題 ➡️
                    </button>
                </div>
            </div>
        </section>

        <!-- 3. 結果結算與錯題大鍋菜畫面 (Result Screen) -->
        <section id="result-screen" class="hidden bg-white rounded-2xl shadow-xl p-6 sm:p-8 border border-slate-100">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-100 text-emerald-600 rounded-full text-3xl mb-3 shadow-inner">
                    🏆
                </div>
                <h2 class="text-2xl font-bold text-slate-900">測驗結果結算</h2>
                <p class="text-slate-500 text-sm mt-1">您已完成本次統測農業概論第9章複習！</p>
            </div>

            <!-- 成績儀表板 -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
                <div class="bg-slate-50 p-4 rounded-2xl text-center border border-slate-100">
                    <div class="text-xs text-slate-500 font-medium">獲得總分</div>
                    <div id="res-score" class="text-2xl sm:text-3xl font-extrabold text-emerald-600 mt-1">0</div>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl text-center border border-slate-100">
                    <div class="text-xs text-slate-500 font-medium">正確率</div>
                    <div id="res-accuracy" class="text-2xl sm:text-3xl font-extrabold text-slate-800 mt-1">0%</div>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl text-center border border-slate-100">
                    <div class="text-xs text-slate-500 font-medium">答對題數</div>
                    <div id="res-correct-count" class="text-2xl sm:text-3xl font-extrabold text-blue-600 mt-1">0/0</div>
                </div>
                <div class="bg-slate-50 p-4 rounded-2xl text-center border border-slate-100">
                    <div class="text-xs text-slate-500 font-medium">總耗時</div>
                    <div id="res-time" class="text-2xl sm:text-3xl font-extrabold text-slate-800 mt-1">00:00</div>
                </div>
            </div>

            <!-- 錯題大鍋菜專區 -->
            <div id="wrong-container" class="mb-8 hidden">
                <div class="border-b border-slate-200 pb-2 mb-4 flex items-center justify-between">
                    <h3 class="text-lg font-bold text-rose-600 flex items-center gap-2">
                        <span>🍲 錯題大鍋菜（錯題訂正與詳細解析）</span>
                    </h3>
                    <span id="wrong-badge" class="bg-rose-100 text-rose-800 text-xs font-semibold px-2.5 py-0.5 rounded-full">0 題錯誤</span>
                </div>
                <div id="wrong-list" class="space-y-4 max-h-[500px] overflow-y-auto pr-2">
                    <!-- 錯題卡片動態插入 -->
                </div>
            </div>

            <!-- 重新測驗按鈕 -->
            <button onclick="resetQuiz()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg transition-transform active:scale-[0.99] flex items-center justify-center gap-2">
                <span>🔄 重新設定並測驗</span>
            </button>
        </section>

    </main>

    <!-- 頁尾 -->
    <footer class="text-center py-6 text-xs text-slate-400">
        統測農業概論線上測驗系統 &copy; 2026 Crafted with Tailwind CSS
    </footer>

    <!-- 內嵌完整題庫與應用邏輯 Script -->
    <script>
        // 完整的 131 題農業概論第9章題庫內嵌
        const questionBank = [
          {
            "題目": "下列有關水產養殖管理的敘述，何者正確？ (A) 曬池主要目的為避免池水滲入地下 (B) 施肥主要目的為促進水中浮游生物繁殖 (C) 為避免魚類受到驚嚇，投餌次數以多量少次為原則 (D) 冬天上午至中午水池中易缺氧，魚因呼吸困難而造成浮頭現象",
            "選項": { "A": "曬池主要目的為避免池水滲入地下", "B": "施肥主要目的為促進水中浮游生物繁殖", "C": "為避免魚類受到驚嚇，投餌次數以多量少次為原則", "D": "冬天上午至中午水池中易缺氧，魚因呼吸困難而造成浮頭現象" },
            "正確答案": "B",
            "詳細解析": "(A) 曬池的主要目的是清除池底殘留雜質、殺菌消毒及防止病原殘留；(B) 施肥可促進淡水魚塭水中浮游生物之繁殖，提供充足的天然餌料，故正確；(C) 投餌原則應把握「少量多次」，而非多量少次；(D) 魚類發生浮頭現象通常是在夏季水溫高的下半夜至清晨和無風悶熱的傍晚。出自農業概論課本第 65 頁與第 67 頁。"
          },
          {
            "題目": "下列何者為虱目魚池混養紅目鱸的主要目的？ (A) 攝食紅筋蟲 (B) 捕食雜魚（例如吳郭魚和大眼海鰱） (C) 殺死雜草 (D) 調整池水的 pH 值",
            "選項": { "A": "攝食紅筋蟲", "B": "捕食雜魚（例如吳郭魚和大眼海鰱）", "C": "殺死雜草", "D": "調整池水的 pH 值" },
            "正確答案": "B",
            "詳細解析": "金目鱸（紅目鱸）喜食小魚、蝦及浮游動物，常被用來和吳郭魚或其他魚池混養，以控制池塘中雜魚（例如吳郭魚和大眼海鰱）的數量。出自農業概論課本第 90 頁。"
          },
          {
            "題目": "下列有關水產養殖的敘述，何者正確？ (A) 吳郭魚屬冷水性魚類，對環境適應性差 (B) 鰻魚多在白天覓食，僅食植物性餌料 (C) 草蝦喜低溫氣候，在 12℃時愈加活躍 (D) 淡水長腳大蝦俗稱泰國蝦，為雜食性",
            "選項": { "A": "吳郭魚屬冷水性魚類，對環境適應性差", "B": "鰻魚多在白天覓食，僅食植物性餌料", "C": "草蝦喜低溫氣候，在 12℃時愈加活躍", "D": "淡水長腳大蝦俗稱泰國蝦，為雜食性" },
            "正確答案": "D",
            "詳細解析": "(A) 吳郭魚屬溫水性熱帶及亞熱帶魚類，對環境適應力極強；(B) 鰻魚為夜行之肉食性魚類；(C) 草蝦屬熱帶水域蝦類，適溫在 25~30℃，14℃時進入假死狀態，低於 12℃或高於 35℃則易死亡；(D) 淡水長腳大蝦俗稱泰國蝦，為雜食性（偏肉食），故正確。出自農業概論課本第 77~78 頁及第 84 頁。"
          },
          {
            "題目": "下列何者不屬於鯉科魚類？ (A) 鯽魚 (B) 吳郭魚 (C) 鰱魚 (D) 草魚",
            "選項": { "A": "鯽魚", "B": "吳郭魚", "C": "鰱魚", "D": "草魚" },
            "正確答案": "B",
            "詳細解析": "吳郭魚屬於慈鯛科（Cichlidae），而鯽魚、鰱魚、草魚均屬於鯉科（Cyprinidae）。出自農業概論課本第 75~77 頁。"
          },
          {
            "題目": "下列有關虱目魚養殖的敘述，何者正確？ (A) 屬淡水魚，不可在鹹水養殖 (B) 藍綠藻影響幼魚成長，故養殖池須將此種藻類清除 (C) 不耐寒流低溫環境 (D) 紅筋蟲對虱目魚成長有益",
            "選項": { "A": "屬淡水魚，不可在鹹水養殖", "B": "藍綠藻影響幼魚成長，故養殖池須將此種藻類清除", "C": "不耐寒流低溫環境", "D": "紅筋蟲對虱目魚成長有益" },
            "正確答案": "C",
            "詳細解析": "(A) 虱目魚為廣鹽性魚類，鹹水或淡水都能養殖；(B) 藍綠藻或養殖池藻類可作為餌料；(C) 虱目魚不耐低溫，冬季易受寒害死亡（14℃以下抵抗性減低，9℃以下易凍斃），故正確；(D) 紅筋蟲（搖蚊幼蟲）會吃池底藻類與虱目魚競食，是虱目魚養殖的嚴重害蟲。出自農業概論課本第 83~84 頁。"
          },
          {
            "題目": "依民國 88 年台灣農業年報資料，養殖漁業中，那一種魚類的產量最多？ (A) 吳郭魚 (B) 鰻魚 (C) 虱目魚 (D) 鱸魚",
            "選項": { "A": "吳郭魚", "B": "鰻魚", "C": "虱目魚", "D": "鱸魚" },
            "正確答案": "A",
            "詳細解析": "依據早期農業統計資料與課本內容，吳郭魚為臺灣主要的淡水養殖魚類，產量極大。出自農業概論課本第 77 頁。"
          },
          {
            "題目": "吳郭魚養殖業者偏愛飼養雄性魚，其目的是下列何項？ (A) 培育成種魚 (B) 池中缺雄性魚 (C) 雄性魚比雌性魚成長快、體型大 (D) 雄性魚殘食性弱",
            "選項": { "A": "培育成種魚", "B": "池中缺雄性魚", "C": "雄性魚比雌性魚成長快、體型大", "D": "雄性魚殘食性弱" },
            "正確答案": "C",
            "詳細解析": "吳郭魚具多產習性且雄性成長較雌性快、體型大，故目前放養的種苗皆要求全雄性苗（單性養殖），以提高養殖效益。出自農業概論課本第 77~78 頁。"
          },
          {
            "題目": "泰國蝦成蝦的養殖使用茶粕，下列何項不是使用茶粕之目的？ (A) 殺除雜魚 (B) 促進底藻生長 (C) 促進性轉變 (D) 可培養浮游生物",
            "選項": { "A": "殺除雜魚", "B": "促進底藻生長", "C": "促進性轉變", "D": "可培養浮游生物" },
            "正確答案": "C",
            "詳細解析": "養殖池使用茶粕主要是為了殺除雜魚、茶粕分解後可作為肥料培養浮游生物或促進底藻生長，茶粕並無促進性轉變的功能。出自農業概論課本第 86 頁與第 88 頁。"
          },
          {
            "題目": "為使日照較多且冬季北風影響較少，養殖魚塭的地形選擇以下列何者為佳？ (A) 東西向較長，南北向較短 (B) 東西向較短，南北向較長 (C) 東北向較長，西南向較短 (D) 東北向較短，西南向較長",
            "選項": { "A": "東西向較長，南北向較短", "B": "東西向較短，南北向較長", "C": "東北向較長，西南向較短", "D": "東北向較短，西南向較長" },
            "正確答案": "A",
            "詳細解析": "魚塭規劃時，選擇東西向較長、南北向較短的地形，可以獲得較充足的日照，並減少冬季強烈北風的直射與影響。出自農業概論課本相關養殖場地選擇原理。"
          },
          {
            "題目": "下列何者屬於貝類？ (A)西施舌 (B)草蝦 (C)蟹 (D)甲魚",
            "選項": { "A": "西施舌", "B": "草蝦", "C": "蟹", "D": "甲魚" },
            "正確答案": "A",
            "詳細解析": "(A) 西施舌屬於貝類（軟體動物門）；(B) 草蝦屬甲殼類；(C) 蟹屬甲殼類；(D) 甲魚屬爬蟲類。出自農業概論課本第 58 頁。"
          },
          {
            "題目": "下列有關鯉科魚類的敘述，何者錯誤？ (A)鰱魚屬於溫水性魚類 (B)青魚為草食性 (C)鯉魚為雜食性 (D)草魚屬於鯉科",
            "選項": { "A": "鰱魚屬於溫水性魚類", "B": "青魚為草食性", "C": "鯉魚為雜食性", "D": "草魚屬於鯉科" },
            "正確答案": "B",
            "詳細解析": "青魚俗稱烏鰡，棲息在中、下層水域，主要攝食螺類、軟體動物、甲殼類及水生昆蟲，屬於淡水之「肉食性」魚類，而非草食性。草魚才是草食性。出自農業概論課本第 76 頁。"

            "題目": "美國貿易關稅亦對我國「臺灣鯛」出口造成衝擊。若臺灣鯛養殖戶小藍 想轉養其他物種，在既有養殖場設施及飼養條件不變下，下列何種物 種最為合適？ (A) 九孔(B) 鮭魚(C) 虹鱒(D) 鱸魚",
            "選項": { "A": "九孔", "B": "鮭魚", "C": "虹鱒", "D": "鱸魚" },
            "正確答案": "D",
            "詳細解析": "金目鱸具廣鹽性，淡水海水均可養殖，是最適合轉換養殖的物種。出自農業概論課本第 90 頁。"
          }
        ];

        // 應用程式狀態變數
        let selectedCount = 'all'; // 20, 40, 50, 'all'
        let selectedMode = 'random'; // 'random', 'sequential'
        let currentQuestions = [];
        let currentIndex = 0;
        let scorePerQ = 0;
        let userAnswers = []; // 儲存作答紀錄
        let timerInterval = null;
        let secondsElapsed = 0;
        let answeredCurrent = false;

        // 設定題數
        function setCount(count) {
            selectedCount = count;
            document.querySelectorAll('.count-btn').forEach(btn => {
                if(btn.getAttribute('data-count') == String(count)) {
                    btn.className = "count-btn py-2.5 px-4 border rounded-xl font-medium text-sm transition-all bg-emerald-600 text-white border-emerald-600 shadow-sm focus:outline-none";
                } else {
                    btn.className = "count-btn py-2.5 px-4 border rounded-xl font-medium text-sm transition-all border-slate-200 hover:bg-emerald-50 hover:border-emerald-500 focus:outline-none";
                }
            });
        }

        // 設定模式
        function setMode(mode) {
            selectedMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                if(btn.getAttribute('data-mode') === mode) {
                    btn.className = "mode-btn py-2.5 px-4 border rounded-xl font-medium text-sm transition-all bg-emerald-600 text-white border-emerald-600 shadow-sm focus:outline-none";
                } else {
                    btn.className = "mode-btn py-2.5 px-4 border rounded-xl font-medium text-sm transition-all border-slate-200 hover:bg-emerald-50 hover:border-emerald-500 focus:outline-none";
                }
            });
        }

        // 開始測驗
        function startQuiz() {
            let pool = [...questionBank];
            
            // 模式處理
            if(selectedMode === 'random') {
                pool.sort(() => Math.random() - 0.5);
            }

            // 題數處理
            let totalQ = pool.length;
            if(selectedCount !== 'all') {
                let limit = parseInt(selectedCount);
                totalQ = Math.min(limit, pool.length);
                currentQuestions = pool.slice(0, totalQ);
            } else {
                currentQuestions = pool;
            }

            scorePerQ = 100 / currentQuestions.length;
            currentIndex = 0;
            userAnswers = [];
            secondsElapsed = 0;

            // 切換畫面
            document.getElementById('config-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('timer-display').classList.remove('hidden');

            // 啟動計時器
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                let m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                let s = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('time-val').innerText = `${m}:${s}`;
            }, 1000);

            loadQuestion();
        }

        // 載入當前題目
        function loadQuestion() {
            answeredCurrent = false;
            let q = currentQuestions[currentIndex];
            
            // 更新進度與標題
            document.getElementById('question-counter').innerText = `第 ${currentIndex + 1} 題 / 共 ${currentQuestions.length} 題`;
            document.getElementById('score-per-question').innerText = `每題 ${scorePerQ.toFixed(1)} 分`;
            let progressPercent = ((currentIndex) / currentQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            document.getElementById('question-text').innerText = q.題目;

            // 隱藏回饋與按鈕
            let fbBox = document.getElementById('feedback-box');
            fbBox.classList.add('hidden');
            document.getElementById('toggle-exp-btn').classList.add('hidden');
            document.getElementById('next-btn').classList.add('hidden');

            // 載入選項
            let optContainer = document.getElementById('options-container');
            optContainer.innerHTML = '';

            for(let key in q.選項) {
                let btn = document.createElement('button');
                btn.type = 'button';
                btn.className = "option-btn w-full text-left p-4 rounded-xl border border-slate-200 hover:bg-slate-50 hover:border-slate-300 transition-all font-medium text-slate-700 flex items-start gap-3 focus:outline-none";
                btn.innerHTML = `<span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 text-slate-600 font-bold text-xs shrink-0">${key}</span> <span>${q.選項[key]}</span>`;
                btn.onclick = () => selectOption(key, btn);
                optContainer.appendChild(btn);
            }
        }

        // 選擇選項互動
        function selectOption(selectedKey, btnElement) {
            if(answeredCurrent) return; // 已經作答過則不能重複點擊
            answeredCurrent = true;

            let q = currentQuestions[currentIndex];
            let isCorrect = (selectedKey === q.正確答案);

            // 記錄使用者作答
            userAnswers.push({
                question: q.題目,
                options: q.選項,
                userAnswer: selectedKey,
                correctAnswer: q.正確答案,
                explanation: q.詳細解析,
                isCorrect: isCorrect
            });

            // 停用所有選項按鈕
            let allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => {
                b.disabled = true;
                b.classList.remove('hover:bg-slate-50', 'hover:border-slate-300');
                // 標示正確答案
                let badge = b.querySelector('span');
                let keyText = badge.innerText.trim();
                if(keyText === q.正確答案) {
                    b.className = "w-full text-left p-4 rounded-xl border border-emerald-500 bg-emerald-50 text-emerald-900 font-medium flex items-start gap-3";
                    badge.className = "inline-flex items-center justify-center w-6 h-6 rounded-full bg-emerald-600 text-white font-bold text-xs shrink-0";
                }
            });

            // 標示使用者點擊的錯誤答案
            if(!isCorrect) {
                btnElement.className = "w-full text-left p-4 rounded-xl border border-rose-500 bg-rose-50 text-rose-900 font-medium flex items-start gap-3";
                let badge = btnElement.querySelector('span');
                badge.className = "inline-flex items-center justify-center w-6 h-6 rounded-full bg-rose-600 text-white font-bold text-xs shrink-0";
            }

            // 顯示即時回饋
            let fbBox = document.getElementById('feedback-box');
            let fbTitle = document.getElementById('feedback-title');
            let fbDesc = document.getElementById('feedback-desc');
            
            fbBox.classList.remove('hidden');
            if(isCorrect) {
                fbBox.className = "mb-6 p-4 rounded-xl border bg-emerald-50 border-emerald-200 text-emerald-800";
                fbTitle.innerText = "🎉 答對了！太棒了！";
                fbDesc.innerText = `正確答案為 (${q.正確答案})。`;
            } else {
                fbBox.className = "mb-6 p-4 rounded-xl border bg-rose-50 border-rose-200 text-rose-800";
                fbTitle.innerText = `❌ 答錯了！正確答案是 (${q.正確答案})`;
                fbDesc.innerText = `您選擇了 (${selectedKey})。`;
            }

            // 顯示查看解析與下一題按鈕
            document.getElementById('toggle-exp-btn').classList.remove('hidden');
            document.getElementById('next-btn').classList.remove('hidden');
        }

        // 切換顯示詳細解析
        function toggleExplanation() {
            let q = currentQuestions[currentIndex];
            let fbDesc = document.getElementById('feedback-desc');
            let toggleBtn = document.getElementById('toggle-exp-btn');
            
            if(toggleBtn.innerText.includes('詳細解析')) {
                fbDesc.innerHTML = `<strong>【詳細解析】：</strong><br>${q.詳細解析}`;
                toggleBtn.innerText = "📖 隱藏詳細解析";
            } else {
                fbDesc.innerText = `正確答案為 (${q.正確答案})。`;
                toggleBtn.innerText = "📖 查看詳細解析";
            }
        }

        // 下一題或結束結算
        function nextQuestion() {
            currentIndex++;
            if(currentIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        // 結束結算
        function finishQuiz() {
            clearInterval(timerInterval);
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('timer-display').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');

            // 計算成績
            let correctCount = userAnswers.filter(a => a.isCorrect).length;
            let totalScore = Math.round(correctCount * scorePerQ);
            let accuracy = Math.round((correctCount / currentQuestions.length) * 100);

            document.getElementById('res-score').innerText = totalScore;
            document.getElementById('res-accuracy').innerText = `${accuracy}%`;
            document.getElementById('res-correct-count').innerText = `${correctCount} / ${currentQuestions.length}`;
            
            let m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            let s = String(secondsElapsed % 60).padStart(2, '0');
            document.getElementById('res-time').innerText = `${m}:${s}`;

            // 處理錯題大鍋菜
            let wrongItems = userAnswers.filter(a => !a.isCorrect);
            let wrongContainer = document.getElementById('wrong-container');
            let wrongList = document.getElementById('wrong-list');
            let wrongBadge = document.getElementById('wrong-badge');

            if(wrongItems.length > 0) {
                wrongContainer.classList.remove('hidden');
                wrongBadge.innerText = `${wrongItems.length} 題錯誤`;
                wrongList.innerHTML = '';

                wrongItems.forEach((item, idx) => {
                    let card = document.createElement('div');
                    card.className = "bg-rose-50/50 border border-rose-100 rounded-2xl p-4 sm:p-5";
                    card.innerHTML = `
                        <div class="font-bold text-slate-900 mb-2">Q: ${item.question}</div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm mb-3">
                            <div class="bg-rose-100/60 text-rose-900 px-3 py-1.5 rounded-lg">
                                ❌ 您的作答：<strong>(${item.userAnswer}) ${item.options[item.userAnswer]}</strong>
                            </div>
                            <div class="bg-emerald-100/60 text-emerald-900 px-3 py-1.5 rounded-lg">
                                ✔️ 正確答案：<strong>(${item.correctAnswer}) ${item.options[item.correctAnswer]}</strong>
                            </div>
                        </div>
                        <div class="text-xs sm:text-sm bg-white p-3 rounded-xl border border-slate-200 text-slate-700 leading-relaxed">
                            <strong class="text-emerald-700">📖 詳細試題解析：</strong><br>${item.explanation}
                        </div>
                    `;
                    wrongList.appendChild(card);
                });
            } else {
                wrongContainer.classList.add('hidden');
            }
        }

        // 重新設定
        function resetQuiz() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('config-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
